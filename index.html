<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Showroom — Static Demo Sites</title>
  <link rel="stylesheet" href="./shared/reset.css" />
  <style>
    :root {
      --bg: #0f1117;
      --surface: #181b24;
      --surface-hover: #1f2431;
      --border: #272c3a;
      --text: #e7e9ee;
      --muted: #9aa2b1;
      --accent: #6d8bff;
      --radius: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    .wrap {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px;
    }

    header.hero {
      padding: 72px 0 40px;
      border-bottom: 1px solid var(--border);
    }

    header.hero .eyebrow {
      color: var(--accent);
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    header.hero h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.1;
      margin: 12px 0 14px;
      letter-spacing: -0.02em;
    }

    header.hero p {
      color: var(--muted);
      max-width: 60ch;
      font-size: 1.05rem;
    }

    main {
      padding: 40px 0 80px;
      flex: 1;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s ease, border-color 0.15s ease,
        background 0.15s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      background: var(--surface-hover);
    }

    .card .thumb {
      aspect-ratio: 16 / 9;
      width: 100%;
      object-fit: cover;
      background: #12141c;
      border-bottom: 1px solid var(--border);
    }

    .card .body {
      padding: 18px 20px 22px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .card h2 {
      font-size: 1.15rem;
      letter-spacing: -0.01em;
    }

    .card p {
      color: var(--muted);
      font-size: 0.95rem;
      flex: 1;
    }

    .card .cta {
      margin-top: 6px;
      align-self: flex-start;
      color: var(--accent);
      font-weight: 600;
      font-size: 0.95rem;
    }

    .card .cta::after {
      content: " →";
    }

    .notice {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      max-width: 640px;
      margin: 8px auto;
      text-align: center;
    }

    .notice h2 {
      font-size: 1.3rem;
      margin-bottom: 12px;
    }

    .notice p {
      color: var(--muted);
      margin-bottom: 12px;
    }

    .notice code {
      background: #0b0d13;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.9em;
      color: #d7defb;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 24px 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    @media (max-width: 520px) {
      header.hero {
        padding: 48px 0 32px;
      }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <div class="eyebrow">The Showroom</div>
      <h1>Static demo sites, on display.</h1>
      <p>
        A gallery of self-contained static websites — each one its own folder,
        each one relative-path clean, each one ready to view on GitHub Pages.
      </p>
    </div>
  </header>

  <main>
    <div class="wrap">
      <div class="grid" id="grid" aria-live="polite"></div>
    </div>
  </main>

  <footer>
    <div class="wrap">Built as a data-driven showcase &middot; no build step, no dependencies.</div>
  </footer>

  <script>
    const grid = document.getElementById("grid");

    function showNotice() {
      grid.style.display = "block";
      grid.innerHTML = `
        <div class="notice">
          <h2>Couldn't load the demo list</h2>
          <p>
            This gallery reads <code>demos.json</code> at runtime, which browsers
            block when a page is opened directly from disk (<code>file://</code>).
          </p>
          <p>To preview it locally, run a small web server from the repo root:</p>
          <p><code>python3 -m http.server</code></p>
          <p>then open <code>http://localhost:8000</code> — or just view it on GitHub Pages.</p>
        </div>`;
    }

    function renderCards(demos) {
      if (!Array.isArray(demos) || demos.length === 0) {
        grid.style.display = "block";
        grid.innerHTML = `<div class="notice"><h2>No demos yet</h2><p>Add an entry to <code>demos.json</code> to get started.</p></div>`;
        return;
      }
      grid.innerHTML = demos
        .map((d) => {
          const folder = `./demos/${d.slug}/`;
          const thumb = d.thumbnail || `${folder}assets/thumbnail.svg`;
          return `
            <a class="card" href="${folder}">
              <img class="thumb" src="${thumb}" alt="${d.name} thumbnail" loading="lazy"
                   onerror="this.style.visibility='hidden'" />
              <div class="body">
                <h2>${d.name}</h2>
                <p>${d.description}</p>
                <span class="cta">View demo</span>
              </div>
            </a>`;
        })
        .join("");
    }

    fetch("./demos.json")
      .then((res) => {
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      })
      .then(renderCards)
      .catch(showNotice);
  </script>
</body>
</html>
